services:
  - type: web
    name: ruta-rides-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node scripts/create-admin.js && node server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: GEOCODING_PROVIDER
        value: osm
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_VIEWBOX
        value: -69.68,9.98,-69.56,9.88
      - key: ROUTING_PROVIDER
        value: osrm
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: EXCHANGE_RATE_URL
        value: https://ve.dolarapi.com/v1/dolares/oficial
    # Plan gratuito: sin disco. La base SQLite es efímera y se recrea con los
    # datos iniciales en cada arranque. Para persistir, usar plan starter y:
    #   env DB_PATH=/var/data/database.sqlite
    #   disk: name ruta-data, mountPath /var/data, sizeGB 1
