services:
  - type: web
    name: ruta-rides-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node scripts/create-admin.js && node server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: GEOCODING_PROVIDER
        value: osm
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_VIEWBOX
        value: -69.68,9.98,-69.56,9.88
      - key: ROUTING_PROVIDER
        value: osrm
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: EXCHANGE_RATE_URL
        value: https://ve.dolarapi.com/v1/dolares/oficial
    # PRODUCCIÓN CON DINERO REAL:
    # 1) Opción A (recomendada): PostgreSQL gestionado.
    #    - Crear base Postgres y definir DATABASE_URL.
    #    - El backend detecta DATABASE_URL y usa Postgres automáticamente.
    # 2) Opción B: plan starter + disco persistente.
    #    - plan: starter
    #    - disk: name ruta-data, mountPath /var/data, sizeGB 1
    #    - env DB_PATH=/var/data/database.sqlite
    # 3) Exigir documentos aprobados para conectarse:
    #    - env REQUIRE_DOCS_FOR_ONLINE=true
    # Sin una de las dos primeras, los datos se pierden al reiniciar.
